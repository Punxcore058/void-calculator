}

<body>

<script>
'use strict';
const byId = id => document.getElementById(id);
const isIOSBrowser = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroidBrowser = /Android/i.test(navigator.userAgent);
const screen = byId('screen'), value = byId('value'), keypad = byId('keys');
const pairStatus = byId('pairStatus');
const connectionIndicator = byId('connectionIndicator');
function setConnectionState(connected) {
    const message = connected ? 'Connected to PINX' : 'Not connected to PINX';
    connectionIndicator.dataset.connected = String(connected);
    connectionIndicator.setAttribute('aria-label', `${message}. Tap three times to install PINX.`);
    connectionIndicator.title = `${message} — tap three times to install PINX`;
}
setConnectionState(false);
function setConnectionStatus(message) {
    if (pairStatus) {
        pairStatus.hidden = false;
        pairStatus.textContent = message;
    }
}
const fullscreenStatus = byId('fullscreenStatus');
async function toggleFullscreen() {
    fullscreenStatus.textContent = '';
    try {
        if (document.fullscreenElement) {
            if (typeof document.exitFullscreen === 'function') await document.exitFullscreen();
            else fullscreenStatus.textContent = isIOSBrowser
                ? 'iPhone Safari cannot switch browser fullscreen. Use Share > Add to Home Screen for an app-style view.'
                : 'Fullscreen is not supported by this browser.';
        } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        } else {
            fullscreenStatus.textContent = isIOSBrowser
                ? 'iPhone Safari cannot switch browser fullscreen. Use Share > Add to Home Screen for an app-style view.'
                : 'Fullscreen is not supported by this browser.';
        }

        fullscreenStatus.textContent = isIOSBrowser
            ? 'iPhone Safari cannot switch browser fullscreen. Use Share > Add to Home Screen for an app-style view.'
            : 'Fullscreen could not be changed. Check your browser permissions and try again.';
    }
}
function exitCalculator() {
    window.close();
    window.setTimeout(() => {
        if (!window.closed) window.location.replace('about:blank');
    }, 0);
}
let entry = '0', left = null, operator = '', fresh = false, birthdayInput = '', busy = false;
let revealed = false, audio;
let installPrompt = null, installTapCount = 0, installTapTimer;
const keyButtons = new Map();
const operators = { '÷': (a,b) => b !== 0 ? a / b : 0, '×': (a,b) => a*b, '−': (a,b) => a-b, '+': (a,b) => a+b };
connectionIndicator.addEventListener('click', registerInstallTap);
function registerInstallTap() {
    clearTimeout(installTapTimer);
    installTapCount++;
    if (installTapCount === 3) {
        installTapCount = 0;
        void activateInstallation();
    } else {
        installTapTimer = window.setTimeout(() => { installTapCount = 0; }, 800);
    }
}
for (const label of ['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=']) {
    const button = document.createElement('button');
    button.className = 'key';
    if (['AC','±','%'].includes(label)) button.classList.add('utility');
    if (label in operators || label === '=') button.classList.add('operator');
    if (label === '0') button.classList.add('zero');
    button.textContent = label;
    if (label === '.') {
        button.setAttribute('aria-label', 'Decimal point and fullscreen toggle');
        button.title = 'Decimal point and fullscreen toggle';
    }
    if (label === '%') {
        button.setAttribute('aria-label', 'Exit app');
        button.title = 'Exit app';
    }
    if (label === '±') {
        button.setAttribute('aria-label', 'Toggle sign; double-tap to connect or disconnect Bluetooth');
        button.title = 'Toggle sign · double-tap to connect or disconnect Bluetooth';
    }
    button.addEventListener('click', event => {
        clearTimeout(installTapTimer);
        installTapCount = 0;
        if (label === '±') {
            if (event.detail === 2) {
                press(label);
                void toggleBluetoothConnection();
                return;
            }
        }
        if (label === '.') void toggleFullscreen();
        press(label);
    });
    keyButtons.set(label, button);
    keypad.append(button);
}
function fit() {
    value.style.fontSize = '';
    if (value.classList.contains('details')) return;
    const width = screen.clientWidth - 18;
    const textWidth = value.scrollWidth;
    if (width > 0 && textWidth > width) value.style.fontSize = Math.floor(72 * width / textWidth) + 'px';
}
function show(text) {
    value.textContent = text;
    value.classList.toggle('details', text.includes('\n') || (text.length > 28 && /\s/.test(text)));
    keyButtons.get('AC').textContent = entry === '0' && left === null ? 'AC' : 'C';
    fit();
}
window.addEventListener('resize', fit);
const currentUrl = new URL(location.href);
const hasWifiPairingLink = isPairingLink(currentUrl);
const relayRoomId = currentUrl.searchParams.get('relay') || '';
const hasRelayPairingLink = /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(relayRoomId);
const canWifiPair = hasWifiPairingLink || hasRelayPairingLink;
let relayEndpoint = null;
async function wifiEndpoint(path) {
    if (!hasRelayPairingLink) return new URL(path, location.href).href;
    if (relayEndpoint === null) {
        const response = await fetch(new URL('./relay-config.json', location.href), { cache: 'no-store' });
        if (!response.ok) throw new Error('PINX relay configuration is unavailable');
        const config = await response.json();
        const configuredEndpoint = typeof config.endpoint === 'string' ? config.endpoint.trim() : '';
        if (!configuredEndpoint) throw new Error('PINX relay is not configured');
        const endpoint = new URL(configuredEndpoint);
        if (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password ||
                endpoint.pathname !== '/' || endpoint.search || endpoint.hash) {
            throw new Error('PINX relay is not configured');
        }
        relayEndpoint = endpoint.href.replace(/\/+$/, '');
    }
    if (!relayEndpoint) throw new Error('PINX relay is not configured');
    return `${relayEndpoint}/api/rooms/${relayRoomId}/${path}`;
}
let pairedOverWifi = false;
let pendingDigitSend = Promise.resolve();
let pairedDigitDelay = 1;
let bluetoothSession = null;
let bluetoothConnecting = false;
let outgoingDigits = '';

function sendDeletedDigit(digits, finalDigit) {
    const session = bluetoothSession;
    pendingDigitSend = pendingDigitSend.then(async () => {
        await pause(pairedDigitDelay * 1000);
        if (session) {
            if (session !== bluetoothSession) return;
            const bytes = new TextEncoder().encode((finalDigit ? '!' : '') + digits);
            await bluetoothOperation(session, () => session.write.writeValueWithResponse(bytes));
            return;
        }
        const path = hasRelayPairingLink
            ? await wifiEndpoint('send')
            : new URL((finalDigit ? 'send/final/' : 'send/') + digits, location.href).href;
        const response = await fetch(path, {
            method: 'POST',
            headers: hasRelayPairingLink ? { 'Content-Type': 'text/plain' } : undefined,
            body: hasRelayPairingLink ? (finalDigit ? '!' : '') + digits : undefined
        });
        if (!response.ok) throw new Error('PINX rejected the digit.');
    }).catch(() => {
        byId(session ? 'bluetoothStatus' : 'pairStatus').textContent =
            'Could not send the last digit. Check the phone connection.';
    });
}

function eraseLastDigit() {
    if (busy || (fresh && operator)) return;
    const numeric = /^-?\d+\.?\d*$/.test(entry);
    const remaining = numeric ? entry.slice(0, -1) : '';
    const removed = entry.slice(-1);
    if ((pairedOverWifi || bluetoothSession) && numeric && /^\d$/.test(removed)) {
        const finalDigit = !/\d/.test(remaining);
        outgoingDigits = (removed + outgoingDigits).slice(0, 16);
        sendDeletedDigit(outgoingDigits, finalDigit);
        if (finalDigit) outgoingDigits = '';
    }
    revealed = false;
    entry = remaining;
    if (!entry || entry === '-') entry = '0';
    birthdayInput = '';
    fresh = false;
    show(entry);
}
{
    let swipeStart;
    screen.style.touchAction = 'pan-y';
    screen.addEventListener('pointerdown', event => {
        if (!event.isPrimary || event.button !== 0) return;
        swipeStart = { id: event.pointerId, x: event.clientX, y: event.clientY };
    });
    screen.addEventListener('pointercancel', () => { swipeStart = null; });
    screen.addEventListener('pointerup', event => {
        if (!swipeStart || swipeStart.id !== event.pointerId) return;
        const dx = Math.abs(event.clientX - swipeStart.x);
        const dy = Math.abs(event.clientY - swipeStart.y);
        swipeStart = null;
        if (busy) return;
        if (dx < 12 && dy < 12) return;
        if (dx < 30 || dx <= dy * 1.5) return;
        if (pairedOverWifi || bluetoothSession) {
            eraseLastDigit();
            return;
        }
        const prediction = getPrediction();
        if (prediction) reveal(prediction);
    });
}

function normalize(number) {
    return String(number);
}
function birthdayDigits(text) {
    return /^\d{7,8}$/.test(text) ? text.padStart(8, '0') : '';
}
function rememberBirthday() {
    birthdayInput = birthdayDigits(entry) || birthdayInput;
}
function press(key) {
    if (busy) return;
    outgoingDigits = '';
    if (revealed) { revealed = false; show(entry); }
    if (key === 'AC') {
        entry = '0'; left = null; operator = ''; fresh = false; birthdayInput = '';
    } else if (key in operators) {
        rememberBirthday();
        if (operator && !fresh) entry = normalize(operators[operator](left, Number(entry)));
        left = Number(entry); operator = key; fresh = true;
    } else if (key === '=') {
        rememberBirthday();
        if (left !== null && operator) {
            entry = normalize(operators[operator](left, Number(entry)));
        }
        left = null; operator = ''; fresh = true;
        for (const name of Object.keys(operators)) keyButtons.get(name).setAttribute('aria-pressed', 'false');
    } else if (key === '%') {
        exitCalculator();
        return;
    } else if (key === '±') {
        if (entry !== '0') entry = entry.startsWith('-') ? entry.slice(1) : '-' + entry;
    } else {
        if (fresh || entry === 'Error') entry = '0';
        fresh = false;
        if (key === '.') {
            if (!entry.includes('.')) entry += '.';
        } else if (entry.length < 16) {
            entry = entry === '0' ? key : entry + key;
        }
        if (left === null) birthdayInput = '';
    }
    for (const name of Object.keys(operators)) keyButtons.get(name).setAttribute('aria-pressed', String(name === operator));
    show(entry);
}
const zodiacSigns = ['Capricorn', 'Aquarius', 'Pisces', 'Aries', 'Taurus', 'Gemini',
    'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius'];

function birthdayPrediction(text) {
    const digits = birthdayDigits(text);
    if (!digits) return null;
    const month = Number(digits.slice(0,2)), day = Number(digits.slice(2,4)), year = Number(digits.slice(4));
    if (month < 1 || month > 12 || year < 1900 || day < 1 ||
        day > new Date(year, month, 0).getDate()) return null;
    const birthDate = new Date(year, month - 1, day);
    const today = new Date();
    const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (birthDate > todayDate) return null;
    let age = today.getFullYear() - year;
    if (today.getMonth() < month - 1 ||
        (today.getMonth() === month - 1 && today.getDate() < day)) age--;
    const cutoffs = [20,19,21,20,21,21,23,23,23,23,22,22];
    const birthday = new Intl.DateTimeFormat(undefined, {
        month: 'long', day: 'numeric', year: 'numeric'
    }).format(birthDate);
    return {
        digits,
        result: zodiacSigns[(month - 1 + (day >= cutoffs[month - 1] ? 1 : 0)) % 12],
        birthday,
        age

}
function getPrediction() {
    return birthdayPrediction(birthdayDigits(entry) || birthdayInput);
}
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
function chime() {
    if (!audio || audio.state !== 'running') return;

    tone.type = 'triangle';

    tone.frequency.setValueAtTime(795, now + .11);

async function playWebGlitch() {
    screen.classList.remove('glitching');

    try {
        await pause(900);
    } finally {
        screen.classList.remove('glitching');
    }
}

async function finishPredictionHandoff(result, reduced) {
    show(result);
    if (reduced || typeof value.animate !== 'function') return;
    screen.classList.add('handoff');
    try {
        await value.animate([
            { transform: 'translateX(-40vw)', opacity: 0 },
            { transform: 'translateX(-16px)', opacity: .8, offset: .65 },
            { transform: 'translateX(-6px)', opacity: .5, offset: .78 },
            { transform: 'translateX(0)', opacity: 1 }

        screen.classList.remove('handoff');

async function reveal(prediction, incoming = false) {
    if (busy) return;
    busy = true;
    keypad.inert = true;
    const zodiacOnly = zodiacSigns.includes(prediction.result);
    const continuingHandoff = incoming && !Number.isFinite(Number(prediction.result));
    const quiet = continuingHandoff;
    if (!quiet && window.AudioContext) {
        try { audio ??= new AudioContext(); audio.resume().catch(() => {}); } catch (error) {}

    const transferDelay = Number(prediction.digitDelay);
    const interval = (incoming && Number.isInteger(transferDelay) && transferDelay >= 1 && transferDelay <= 4

        if (continuingHandoff) {
            await finishPredictionHandoff(prediction.result, reduced);
            revealed = true;
            return;

            await pause(interval);
            formed += digit;
            show(formed);

                value.animate([
                    { opacity: .35, transform: 'translateX(-30px)' },
                    { opacity: 1, transform: 'translateX(0)' }

        }
        await pause(400);
        if (!quiet) chime();
        if (!reduced) await playWebGlitch();
        show(prediction.birthday
            ? `Birthday: ${prediction.birthday}\nAge: ${prediction.age}\nZodiac: ${prediction.result}`
            : prediction.result);
        if (!reduced && value.animate) {
            await value.animate([{opacity:.2, transform:'translateY(5px)'},{opacity:1, transform:'translateY(0)'}],

}
document.addEventListener('keydown', event => {
    if (busy || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target instanceof HTMLButtonElement && ['Enter', ' '].includes(event.key)) return;
    const key = ({ Enter:'=', Escape:'AC', '*':'×', '/':'÷', '-':'−' })[event.key] || event.key;
    if (!keyButtons.has(key)) return;
    event.preventDefault();
    press(key);
});
function isPairingLink(url) {
    return url.protocol === 'http:' && url.port && !url.username && !url.password &&
        !url.search && !url.hash &&

            /^\/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\/$/i.test(url.pathname));

let pendingReceived = '';
let pendingReveal = null;

function acceptPhonePacket(payload) {
    if (payload.length <= 64 && /^-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?$/.test(payload)) {
        pendingReceived = payload;
    } else if (payload.startsWith('{')) {
        try {
            const packet = JSON.parse(payload);
            if (typeof packet.digits === 'string' && /^\d{1,16}$/.test(packet.digits) &&
                    typeof packet.result === 'string' && packet.result.trim() && packet.result.length <= 512) {
                pendingReveal = packet;

        const packet = pendingReveal;
        pendingReveal = null;
        reveal(packet, true);

        const received = pendingReceived;
        pendingReceived = '';
        outgoingDigits = '';
        entry = received;
        left = null;
        operator = '';
        fresh = true;
        revealed = false;
        birthdayInput = '';
        for (const name of Object.keys(operators)) keyButtons.get(name).setAttribute('aria-pressed', 'false');
        show(received);
    }
}

function updatePairedDelay(delay) {
    if (Number.isInteger(delay) && delay >= 1 && delay <= 4) pairedDigitDelay = delay;
}

let wifiConnectionConfirmed = false;
let wifiConnecting = false;
async function receiveWifiDigits() {
    if (!pairedOverWifi) return;
    try {
        const response = await fetch(await wifiEndpoint('digits'), { cache: 'no-store' });
        if (!response.ok) throw new Error('PINX Wi-Fi session unavailable');
        updatePairedDelay(Number(response.headers.get('X-PINX-Digit-Delay')));
        wifiConnectionConfirmed = true;
        setConnectionState(true);
        setConnectionStatus('Connected to PINX over Wi-Fi');
        acceptPhonePacket(await response.text());
    } catch (error) {
        setConnectionState(false);
        setConnectionStatus(wifiConnectionConfirmed
            ? 'Connection lost — retrying…'
            : 'PINX unavailable — check Wi-Fi');
    } finally {
        if (pairedOverWifi) setTimeout(receiveWifiDigits, hasRelayPairingLink ? 1000 : 350);
    }
}

byId('wifiConnect').addEventListener('click', async () => {
    if (!canWifiPair || wifiConnecting || pairedOverWifi) return;
    const code = byId('pairingCode').value.trim();
    if (!/^\d{6}$/.test(code)) {
        setConnectionStatus('Enter the six-digit PIN 123456.');
        return;
    }
    wifiConnecting = true;
    byId('wifiConnect').disabled = true;
    setConnectionStatus('Checking PINX Wi-Fi PIN…');
    try {
        const response = await fetch(await wifiEndpoint('pair'), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: code,
            cache: 'no-store'
        });
        if (!response.ok) {
            setConnectionStatus(response.status === 401
                ? 'PINX did not accept that PIN. Check it and try again.'
                : 'PINX pairing request failed. Check the relay or reopen the PINX pairing link.');
            return;
        }
        pairedOverWifi = true;
        byId('pairingCode').value = '';
        byId('wifiConnect').textContent = 'Connected over Wi-Fi';
        setConnectionStatus('PIN accepted. Connecting to PINX…');
        void receiveWifiDigits();
    } catch (error) {
        setConnectionStatus(hasRelayPairingLink
            ? 'Could not reach the PINX relay. Check internet access and relay setup.'
            : 'Could not reach PINX. Check Wi-Fi and reopen its pairing link.');
    } finally {
        wifiConnecting = false;
        byId('wifiConnect').disabled = false;
    }
});

const voidBluetoothService = 'f307bcce-d82d-4c4b-a123-1cc717069ad1';
const voidBluetoothRead = 'f307bcce-d82d-4c4b-a123-1cc717069ad2';
const voidBluetoothWrite = 'f307bcce-d82d-4c4b-a123-1cc717069ad3';
const bluetoothButton = keyButtons.get('±');
const bluetoothStatus = byId('bluetoothStatus');
const wifiPairHelp = byId('wifiPairHelp');
byId('openPinx').hidden = !isAndroidBrowser;
wifiPairHelp.hidden = !canWifiPair;
if (canWifiPair) {
    wifiPairHelp.textContent = hasRelayPairingLink
        ? 'Enter Wi-Fi PIN 123456 to connect through the relay. Both phones need internet access.'
        : 'Enter Wi-Fi PIN 123456. Keep both phones on the same Wi-Fi network.';
}
if (isIOSBrowser) {
    if (!canWifiPair) setConnectionStatus('Open PINX’s Wi-Fi pairing link or QR code first.');
}
byId('wifiConnect').hidden = !canWifiPair;
byId('pairingCode').hidden = !canWifiPair;

function setBluetoothStatus(message) {
    bluetoothStatus.hidden = false;
    bluetoothStatus.textContent = message;
}

function bluetoothOperation(session, operation) {
    const next = session.operation.then(() => {
        if (session !== bluetoothSession) throw new Error('Bluetooth disconnected');
        return operation();
    });
    session.operation = next.catch(() => {});
    return next;
}

function endBluetoothSession(session, message) {
    if (session !== bluetoothSession) return;
    bluetoothSession = null;
    pendingReceived = '';
    pendingReveal = null;
    outgoingDigits = '';
    if (session.device.gatt.connected) session.device.gatt.disconnect();
    setConnectionState(false);
    setBluetoothStatus(message);
}

async function pollBluetooth(session) {
    if (session !== bluetoothSession) return;
    try {
        // Each read contains up to 19 data bytes and a frame marker.
        for (let frame = 0; frame < 160; frame++) {
            const value = await bluetoothOperation(session, () => session.read.readValue());
            if (session !== bluetoothSession) return;
            if (value.byteLength < 1) throw new Error('Empty Bluetooth frame');
            const type = value.getUint8(0);
            if (type === 0) {
                if (value.byteLength >= 2) updatePairedDelay(value.getUint8(1));
                session.decoder = new TextDecoder();
                session.payload = '';
                acceptPhonePacket('');
                break;
            }
            if (type !== 1 && type !== 2 || value.byteLength > 20) throw new Error('Invalid Bluetooth frame');
            session.payload += session.decoder.decode(
                new Uint8Array(value.buffer, value.byteOffset + 1, value.byteLength - 1), { stream: type === 1 });
            if (session.payload.length > 4096) throw new Error('Bluetooth message too long');
            if (type === 2) {
                acceptPhonePacket(session.payload);
                session.payload = '';
                break;
            }
        }
        setTimeout(() => pollBluetooth(session), 350);
    } catch (error) {
        endBluetoothSession(session, 'Bluetooth disconnected. Reconnect to PINX.');
    }
}

async function toggleBluetoothConnection() {
    if (bluetoothSession) {
        endBluetoothSession(bluetoothSession, 'Bluetooth disconnected.');
        return;
    }
    if (bluetoothConnecting) return;
    if (hasWifiPairingLink) {
        setBluetoothStatus(isIOSBrowser
            ? 'iPhone browsers do not support Web Bluetooth. Use PINX Wi-Fi pairing on the same network.'
            : 'Open the HTTPS calculator page to switch from Wi-Fi to Bluetooth.');
        return;
    }
    if (isIOSBrowser) {
        setBluetoothStatus('iPhone browsers do not support Web Bluetooth. Use PINX Wi-Fi pairing instead.');
        return;
    }
    if (!window.isSecureContext) {
        setBluetoothStatus('Bluetooth pairing requires the HTTPS calculator page.');
        return;
    }
    if (!navigator.bluetooth) {
        setBluetoothStatus('Bluetooth needs a supported browser with Web Bluetooth, such as Chrome on Android.');
        return;
    }
    bluetoothConnecting = true;
    bluetoothButton.disabled = true;
    setBluetoothStatus('Choose PINX from the Bluetooth device list.');
    let device;
    let phase = 'device selection';
    try {
        device = await navigator.bluetooth.requestDevice({ filters: [{ services: [voidBluetoothService] }] });
        phase = 'connecting to PINX';
        const gatt = await device.gatt.connect();
        phase = 'finding the PINX service';
        const service = await gatt.getPrimaryService(voidBluetoothService);
        const read = await service.getCharacteristic(voidBluetoothRead);
        const write = await service.getCharacteristic(voidBluetoothWrite);
        phase = 'opening the PINX session';
        await write.writeValueWithResponse(new TextEncoder().encode('C'));
        const session = { device, read, write, operation: Promise.resolve(), decoder: new TextDecoder(), payload: '' };
        bluetoothSession = session;
        setConnectionState(true);
        outgoingDigits = '';
        device.addEventListener('gattserverdisconnected', () =>
            endBluetoothSession(session, 'Bluetooth disconnected. Reconnect to PINX.'), { once: true });
        bluetoothStatus.textContent = '';
        bluetoothStatus.hidden = true;
        pollBluetooth(session);
    } catch (error) {
        if (device?.gatt?.connected) device.gatt.disconnect();
        if (phase === 'device selection' && error?.name === 'NotFoundError') {
            setBluetoothStatus('No PINX device was selected. Start Bluetooth pairing in PINX, then try again.');
        } else if (phase === 'opening the PINX session') {
            setBluetoothStatus('Could not open a PINX Bluetooth session. Make sure pairing is active and try again.');
        } else if (error?.name === 'NotAllowedError') {
            setBluetoothStatus('Bluetooth access was canceled or blocked. Allow Bluetooth for this site and try again.');
        } else {
            setBluetoothStatus(`Bluetooth failed while ${phase}. Check that PINX pairing is active and Nearby devices is allowed.`);
        }
    } finally {
        bluetoothConnecting = false;
        bluetoothButton.disabled = false;
    }
}

window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
});
async function activateInstallation() {
    const installStatus = byId('installStatus');
    if (installPrompt) {
        const promptEvent = installPrompt;
        installPrompt = null;
        try {
            await promptEvent.prompt();
            const choice = await promptEvent.userChoice;
            installStatus.textContent = choice.outcome === 'accepted'
                ? 'PINX was added to your Home Screen.'
                : 'Installation was canceled.';
        } catch (error) {
            console.warn('Could not show the PINX installation prompt.', error);
            installStatus.textContent = 'Use your browser menu to install PINX or add it to your Home Screen.';
        }
        return;
    }

    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
        installStatus.textContent = 'PINX is already installed.';
    } else if (isIOSBrowser) {
        installStatus.textContent = 'In Safari, tap Share > Add to Home Screen, then confirm Add.';
    } else {
        installStatus.textContent = 'Use your browser menu to choose Install app or Add to Home Screen.';
    }
}
window.addEventListener('appinstalled', () => {
    installPrompt = null;
    byId('installStatus').textContent = 'PINX was installed.';
});
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
        .catch(error => console.warn('Could not register the PINX offline app.', error));
}
</script>
